<svg viewBox="0 0 740 470" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, system-ui, sans-serif">
  <title>Arquitetura do Maya-BR</title>
  <desc>Pipeline de voz: microfone passa por VAD e turn-engine, depois ASR, orquestrador com LLM, TTS com estado (CSM) e playback com barge-in. Abaixo, o mapeamento com a Maya e as três trilhas do projeto.</desc>
  <rect x="0" y="0" width="740" height="470" rx="14" fill="#f7f7f5"/>
  <text x="370" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">MAYA-BR — da sua fala até a resposta falada</text>
  <rect x="20" y="52" width="120" height="66" rx="10" fill="#ffffff" stroke="#b8b8b3" stroke-width="1.5"/>
  <text x="80" y="78" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">🎤 Mic</text>
  <text x="80" y="98" text-anchor="middle" font-size="10" fill="#6b6b66">sua fala, 16 kHz</text>
  <rect x="170" y="52" width="120" height="66" rx="10" fill="#ffffff" stroke="#b8b8b3" stroke-width="1.5"/>
  <text x="230" y="74" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a1a">VAD + turn-engine</text>
  <text x="230" y="91" text-anchor="middle" font-size="10" fill="#6b6b66">detecta fala/silêncio</text>
  <text x="230" y="105" text-anchor="middle" font-size="10" fill="#6b6b66">sua vez acabou?</text>
  <rect x="320" y="52" width="120" height="66" rx="10" fill="#ffffff" stroke="#b8b8b3" stroke-width="1.5"/>
  <text x="380" y="78" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">ASR</text>
  <text x="380" y="98" text-anchor="middle" font-size="10" fill="#6b6b66">fala → texto</text>
  <rect x="470" y="52" width="120" height="66" rx="10" fill="#ffffff" stroke="#b8b8b3" stroke-width="1.5"/>
  <text x="530" y="74" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a1a">Orquestrador+LLM</text>
  <text x="530" y="91" text-anchor="middle" font-size="10" fill="#6b6b66">decide O QUE dizer</text>
  <text x="530" y="105" text-anchor="middle" font-size="10" fill="#6b6b66">(bastidor)</text>
  <rect x="470" y="172" width="120" height="66" rx="10" fill="#e7f1e8" stroke="#3a7d44" stroke-width="2.5"/>
  <text x="530" y="194" text-anchor="middle" font-size="12" font-weight="700" fill="#1f4d28">TTS com estado</text>
  <text x="530" y="211" text-anchor="middle" font-size="10" fill="#3a6b41">CSM: texto → SUA voz</text>
  <text x="530" y="225" text-anchor="middle" font-size="10" fill="#3a6b41">ouve a conversa toda</text>
  <rect x="170" y="172" width="120" height="66" rx="10" fill="#ffffff" stroke="#b8b8b3" stroke-width="1.5"/>
  <text x="230" y="198" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">🔊 Playback</text>
  <text x="230" y="218" text-anchor="middle" font-size="10" fill="#6b6b66">interrompível (barge-in)</text>
  <g stroke="#7a7a74" stroke-width="1.8" fill="none" marker-end="url(#arr)">
    <path d="M140 85 L166 85"/>
    <path d="M290 85 L316 85"/>
    <path d="M440 85 L466 85"/>
    <path d="M530 118 L530 168"/>
    <path d="M470 205 L294 205"/>
  </g>
  <path d="M170 205 C 95 205, 85 150, 85 120" stroke="#c25b3a" stroke-width="1.8" fill="none" stroke-dasharray="5 3" marker-end="url(#arrR)"/>
  <text x="98" y="150" font-size="9.5" fill="#c25b3a">se você fala por cima,</text>
  <text x="98" y="162" font-size="9.5" fill="#c25b3a">corta e volta a ouvir</text>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#7a7a74"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#c25b3a"/>
    </marker>
  </defs>
  <line x1="20" y1="262" x2="720" y2="262" stroke="#ddddd8" stroke-width="1"/>
  <text x="20" y="284" font-size="11.5" font-weight="700" fill="#1a1a1a">O que a Sesame usa (descoberto na OSINT)  →  o que NÓS usamos:</text>
  <g font-size="10.5" fill="#4a4a45">
    <text x="20" y="303">VAD: silero → silero (igual)    ·    ASR: faster-whisper → faster-whisper (igual)</text>
    <text x="20" y="320">LLM: Gemma no sglang (cancela em 20 ms) → Gemini/Maritaca plugável</text>
    <text x="20" y="337">Voz: CSM ~1B com 2 min de audio-context → CSM-1B finetunado na voz do Pedro</text>
  </g>
  <rect x="20" y="356" width="225" height="98" rx="10" fill="#ffffff" stroke="#b8b8b3" stroke-width="1.5"/>
  <text x="132" y="378" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Trilha A — a Voz</text>
  <text x="132" y="396" text-anchor="middle" font-size="10" fill="#6b6b66">TTS expressivo, sua voz</text>
  <text x="132" y="411" text-anchor="middle" font-size="10" fill="#6b6b66">CSM / Qwen3-TTS / Chatterbox</text>
  <text x="132" y="433" text-anchor="middle" font-size="10" font-weight="700" fill="#3a7d44">← treinando AGORA no M2</text>
  <rect x="258" y="356" width="225" height="98" rx="10" fill="#ffffff" stroke="#b8b8b3" stroke-width="1.5"/>
  <text x="370" y="378" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Trilha M — a Maya-BR</text>
  <text x="370" y="396" text-anchor="middle" font-size="10" fill="#6b6b66">o pipeline inteiro acima</text>
  <text x="370" y="411" text-anchor="middle" font-size="10" fill="#6b6b66">cascata engenheirada</text>
  <text x="370" y="433" text-anchor="middle" font-size="10" font-weight="700" fill="#3a7d44">← rodando no seu Mac</text>
  <rect x="496" y="356" width="225" height="98" rx="10" fill="#ffffff" stroke="#b8b8b3" stroke-width="1.5"/>
  <text x="608" y="378" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Trilha B — o Spine</text>
  <text x="608" y="396" text-anchor="middle" font-size="10" fill="#6b6b66">Moshi: full-duplex real</text>
  <text x="608" y="411" text-anchor="middle" font-size="10" fill="#6b6b66">ouve e fala ao mesmo tempo</text>
  <text x="608" y="433" text-anchor="middle" font-size="10" font-weight="700" fill="#3a7d44">← futuro (dados das reuniões)</text>
</svg>
